<!doctype html><html lang="ar" dir="rtl"><meta charset=utf-8><title>نهر مباشر</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem}</style>
<h1>نهر مباشر</h1>
<p>أحداث الخادم: <span id=ticks>بانتظار…</span></p>
<p><input id=msg placeholder='اكتب شيئا'> <button id=send>أرسل</button></p>
<pre id=log></pre>
<script>
const log = (t) => document.getElementById('log').textContent += t + '\n';
const events = new EventSource('/ticks');
events.addEventListener('tick', (e) => document.getElementById('ticks').textContent = e.data);
const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onmessage = (e) => log(e.data);
ws.onclose = () => log('(أغلق الاتصال)');
document.getElementById('send').onclick = () => ws.send(document.getElementById('msg').value);
</script>
</html>
